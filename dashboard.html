<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>User Dashboard - AZ-104 Quiz Bank</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div>
        <h1 class="page-title">User Quiz Dashboard</h1>
        <p class="page-subtitle">Score History &amp; Exam Performance Tracking</p>
      </div>
      
      <div id="auth-container">
        <button id="sign-in-btn" class="btn btn-light">Sign In with Google</button>
        <div id="user-info" class="user-info-bar" style="display: none;">
          <span id="user-name" class="user-name-text"></span>
          <a href="index.html" class="btn btn-light">🏠 Home</a>
          <a href="dashboard.html" class="btn btn-light active-btn">📊 Dashboard</a>
          <button id="sign-out-btn" class="btn btn-danger">Sign Out</button>
        </div>
      </div>
    </div>
  </header>

  <div class="container container--narrow">

    <!-- References Bar -->
    <div class="card card--bar">
      <span class="ref-bar-label">📚 References:</span>
      <nav class="ref-bar-nav">
        <a href="references/identity.html" class="btn ref-link">Identity</a>
        <a href="references/storage.html" class="btn ref-link">Storage</a>
        <a href="references/compute.html" class="btn ref-link">Compute</a>
        <a href="references/networking.html" class="btn ref-link">Networking</a>
        <a href="references/monitoring.html" class="btn ref-link">Monitoring</a>
        <a href="limits.html" class="btn ref-link">📋 Limits &amp; Quotas</a>
      </nav>
    </div>

    <div class="card card--content">
      <h3 class="card-heading">Your Exam Score History</h3>
      <div id="auth-warning" class="alert-text">Please sign in from the home page to view your saved scores.</div>
      <div id="scores-container" style="margin-top: 15px;">
        <p class="text-muted">Loading score history...</p>
      </div>
    </div>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
