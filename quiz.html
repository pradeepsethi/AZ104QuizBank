<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title id="quiz-title-tag">AZ-104 Quiz Engine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div>
        <h1 id="quiz-title" class="page-title">AZ-104 Practice Quiz</h1>
        <p class="page-subtitle">AZ-104 Practice Exam Portal</p>
      </div>
      
      <div id="auth-container">
        <button id="sign-in-btn" class="btn btn-light">Sign In with Google</button>
        <div id="user-info" class="user-info-bar" style="display: none;">
          <span id="user-name" class="user-name-text"></span>
          <a href="index.html" class="btn btn-light">🏠 Home</a>
          <a href="dashboard.html" class="btn btn-light">📊 Dashboard</a>
          <button id="sign-out-btn" class="btn btn-danger">Sign Out</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Top Bar with Question Set, Timer, and Exit Quiz Button -->
  <div class="container container--wide">

    <!-- References Bar -->
    <div class="card card--bar" style="margin-bottom: 15px;">
      <span class="ref-bar-label">📚 References:</span>
      <nav class="ref-bar-nav">
        <a href="references/identity.html" class="btn ref-link">Identity</a>
        <a href="references/storage.html" class="btn ref-link">Storage</a>
        <a href="references/compute.html" class="btn ref-link">Compute</a>
        <a href="references/networking.html" class="btn ref-link">Networking</a>
        <a href="references/monitoring.html" class="btn ref-link">Monitoring</a>
        <a href="limits.html" class="btn ref-link">📋 Limits &amp; Quotas</a>
        <a href="commands.html" class="btn ref-link">⚡ CLI &amp; PowerShell</a>
      </nav>
    </div>

    <div class="card quiz-topbar">
      <div class="quiz-topbar__sets" id="quiz-subbar-sets">
        <label for="set-selector">Question Set:</label>
        <select id="set-selector" class="select-control">
          <!-- Dynamically populated from sets_config -->
        </select>
      </div>
      <div class="quiz-topbar__timer-group">
        <div class="quiz-timer-label">
          <span>⏱️ Time Remaining:</span> <span id="quiz-timer" class="quiz-timer">100:00</span>
        </div>
        <a href="index.html" class="btn btn-neutral">← Exit Quiz</a>
      </div>
    </div>
  </div>

  <div class="quiz-layout">
    <!-- Main Question Card -->
    <div id="quiz-card" class="card quiz-card">
      <div class="loading-message">Loading questions...</div>
    </div>

    <!-- Question Palette Sidebar -->
    <div id="palette-card" class="card palette-card">
      <h3 class="card-heading" style="font-size: 16px;">Question Palette</h3>
      <div id="question-palette" class="palette-grid"></div>
    </div>
  </div>

  <script type="module" src="js/quiz.js"></script>
</body>
</html>
